services:
  greenstone:
    build:
      context: .
      dockerfile: Dockerfile
    image: greenstone-classschedule:latest
    container_name: greenstone
    restart: unless-stopped
    ports:
      - "8080:3001"
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - greenstone-data:/data

volumes:
  greenstone-data:
